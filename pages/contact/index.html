<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Связь — ИП Фролов Р.А.</title>
    <meta name="description" content="Обсудим вашу производственную задачу или текущее ТЗ на автоматизацию.">
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg?v=2">
    <link rel="stylesheet" href="../../assets/base.css">
    <style>
        body { padding: 2px; }
        .cta-card {
            flex: 1;
            background:
                radial-gradient(ellipse at 20% 0%, rgba(0, 210, 255, 0.12), transparent 60%),
                linear-gradient(135deg, #111e35 0%, #1e293b 100%);
            border: 1px solid rgba(0, 210, 255, 0.25);
            border-radius: var(--radius-card);
            padding: 30px 25px;
            text-align: center;
            box-shadow: 0 15px 35px -15px rgba(0, 210, 255, 0.1);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }
        .cta-card h2 {
            font-size: 22px; color: #ffffff;
            margin-bottom: 8px; font-weight: 700; letter-spacing: -0.5px;
        }
        .cta-card p {
            color: var(--text-soft); font-size: 14px;
            max-width: 320px; margin: 0 auto 20px auto; line-height: 1.45;
        }
        .cta-hint {
            margin-top: 14px;
            font-family: var(--font-mono);
            font-size: 11px; color: var(--text-muted);
            display: flex; align-items: center; gap: 6px;
        }
        .cta-hint .dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--accent-green);
            box-shadow: 0 0 8px rgba(16,185,129,.8);
            animation: blink 1.8s ease-in-out infinite;
        }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    </style>
</head>

<section class="cta-card">

    <span class="cta-hint"><span class="dot"></span> MAX // мессенджер</span>
</section>

<script src="../../assets/js/block.js"></script>

</html>
