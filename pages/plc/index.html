<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Программирование ПЛК — ИП Фролов Р.А.</title>
    <meta name="description" content="Разработка отказоустойчивого ПО для промышленных контроллеров Siemens, ОВЕН, Schneider Electric.">
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg?v=2">
    <link rel="stylesheet" href="../../assets/base.css">
    <style>
        /* Выравнивание карточек в ряду на главной: одинаковая минимальная высота */
        body { padding: 2px; }
        .service-card { border-top: 3px solid var(--accent-blue); }
    </style>
</head>
<body data-block="plc">

<div class="service-card">
    <div class="svg-container">
        <svg xmlns="http://w3.org/2000/svg" viewBox="0 0 400 180" width="100%" height="100%">
          <rect width="400" height="180" fill="#060913" opacity="0.4"/>

          <!-- Входная линия и аналоговое значение INT -->
          <path d="M 15 90 L 75 90" stroke="var(--accent-blue)" stroke-width="2" fill="none"/>
          <circle cx="15" cy="90" r="3" fill="var(--accent-blue)"/>
          <rect x="18" y="65" width="53" height="20" rx="3" fill="#060913" stroke="#1e293b"/>
          <text id="js-fbd-input" x="44" y="79" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">0</text>
          <text x="18" y="100" fill="var(--accent-blue)" font-family="monospace" font-size="9">IN_WORD</text>

          <!-- Функциональный блок FBD -->
          <g transform="translate(75, 15)">
            <rect width="135" height="145" rx="4" fill="var(--card-bg)" stroke="#334155" stroke-width="2"/>
            <text x="67.5" y="16" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">INT_TO_10BITS</text>
            <text x="8" y="75" fill="var(--accent-blue)" font-family="monospace" font-size="10" font-weight="bold">IN</text>
            <g font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="end">
              <text x="128" y="32">Q0</text><text x="128" y="43">Q1</text>
              <text x="128" y="54">Q2</text><text x="128" y="65">Q3</text>
              <text x="128" y="76">Q4</text><text x="128" y="87">Q5</text>
              <text x="128" y="98">Q6</text><text x="128" y="109">Q7</text>
              <text x="128" y="120">Q8</text><text x="128" y="131">Q9</text>
            </g>
          </g>

          <!-- 10 выходных каналов -->
          <path d="M 210 44 L 240 44" stroke="#334155" stroke-width="1.5" id="js-fbd-l0"/><circle id="js-fbd-led0" cx="246" cy="44" r="3.5" fill="#223147"/><text id="js-fbd-t0" x="256" y="47" fill="var(--text-muted)" font-family="monospace" font-size="9">B0:0</text>
          <path d="M 210 55 L 240 55" stroke="#334155" stroke-width="1.5" id="js-fbd-l1"/><circle id="js-fbd-led1" cx="246" cy="55" r="3.5" fill="#223147"/><text id="js-fbd-t1" x="256" y="58" fill="var(--text-muted)" font-family="monospace" font-size="9">B1:0</text>
          <path d="M 210 66 L 240 66" stroke="#334155" stroke-width="1.5" id="js-fbd-l2"/><circle id="js-fbd-led2" cx="246" cy="66" r="3.5" fill="#223147"/><text id="js-fbd-t2" x="256" y="69" fill="var(--text-muted)" font-family="monospace" font-size="9">B2:0</text>
          <path d="M 210 77 L 240 77" stroke="#334155" stroke-width="1.5" id="js-fbd-l3"/><circle id="js-fbd-led3" cx="246" cy="77" r="3.5" fill="#223147"/><text id="js-fbd-t3" x="256" y="80" fill="var(--text-muted)" font-family="monospace" font-size="9">B3:0</text>
          <path d="M 210 88 L 240 88" stroke="#334155" stroke-width="1.5" id="js-fbd-l4"/><circle id="js-fbd-led4" cx="246" cy="88" r="3.5" fill="#223147"/><text id="js-fbd-t4" x="256" y="91" fill="var(--text-muted)" font-family="monospace" font-size="9">B4:0</text>
          <path d="M 210 99 L 240 99" stroke="#334155" stroke-width="1.5" id="js-fbd-l5"/><circle id="js-fbd-led5" cx="246" cy="99" r="3.5" fill="#223147"/><text id="js-fbd-t5" x="256" y="102" fill="var(--text-muted)" font-family="monospace" font-size="9">B5:0</text>
          <path d="M 210 110 L 240 110" stroke="#334155" stroke-width="1.5" id="js-fbd-l6"/><circle id="js-fbd-led6" cx="246" cy="110" r="3.5" fill="#223147"/><text id="js-fbd-t6" x="256" y="113" fill="var(--text-muted)" font-family="monospace" font-size="9">B6:0</text>
          <path d="M 210 121 L 240 121" stroke="#334155" stroke-width="1.5" id="js-fbd-l7"/><circle id="js-fbd-led7" cx="246" cy="121" r="3.5" fill="#223147"/><text id="js-fbd-t7" x="256" y="124" fill="var(--text-muted)" font-family="monospace" font-size="9">B7:0</text>
          <path d="M 210 132 L 240 132" stroke="#334155" stroke-width="1.5" id="js-fbd-l8"/><circle id="js-fbd-led8" cx="246" cy="132" r="3.5" fill="#223147"/><text id="js-fbd-t8" x="256" y="135" fill="var(--text-muted)" font-family="monospace" font-size="9">B8:0</text>
          <path d="M 210 143 L 240 143" stroke="#334155" stroke-width="1.5" id="js-fbd-l9"/><circle id="js-fbd-led9" cx="246" cy="143" r="3.5" fill="#223147"/><text id="js-fbd-t9" x="256" y="146" fill="var(--text-muted)" font-family="monospace" font-size="9">B9:0</text>

          <!-- Промышленный тумблер RUN/STOP -->
          <foreignObject x="325" y="40" width="65" height="80">
            <div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; font-family: monospace; font-size: 11px; font-weight: bold; color: var(--text-muted); gap: 4px; box-sizing: border-box;">
              <span>I</span>
              <label style="position: relative; display: block; width: 18px; height: 34px; margin: 0; cursor: pointer; -webkit-tap-highlight-color: transparent;">
                <input type="checkbox" id="js-plc-toggle" checked="true" style="position: absolute; opacity: 0; width: 0; height: 0; margin: 0; padding: 0;">
                <span style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: #060913; border: 1px solid #334155; border-radius: 4px; transition: .2s;"></span>
                <style>
                  #js-plc-toggle + span:before { position: absolute; content: ""; height: 14px; width: 14px; left: 1px; top: 1px; background-color: var(--accent-green); box-shadow: 0 0 5px var(--accent-green); border-radius: 2px; transition: .2s; }
                  #js-plc-toggle:not(:checked) + span:before { transform: translateY(16px); background-color: var(--accent-red); box-shadow: 0 0 5px var(--accent-red); }
                </style>
              </label>
              <span>O</span>
            </div>
          </foreignObject>
        </svg>
    </div>

    <h3>Программирование ПЛК</h3>
    <p style="min-height: 66px;">Разработка надежного, отказоустойчивого программного обеспечения для промышленных контроллеров (Siemens, ОВЕН, Schneider Electric и др.) строго под ваши технологические процессы.</p>

    <div class="card-gallery">
        <button class="gallery-thumb" data-title="Программа ПЛК"><img src="img/seplc.jpg" alt="Программа ПЛК" loading="lazy"></button>
        <button class="gallery-thumb" data-title="Программа ПЛК"><img src="img/zplc.jpg" alt="Программа ПЛК" loading="lazy"></button>
        <button class="gallery-thumb" data-title="Программа ПЛК"><img src="img/splc.jpg" alt="Программа ПЛК" loading="lazy"></button>
    </div>
</div>

<script src="../../assets/js/block.js"></script>
<script src="../../assets/js/gallery.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    // Локальная симуляция 10-битной развёртки INT -> BITS (тумблер RUN/STOP)
    const fbdIn = document.getElementById("js-fbd-input");
    let intValue = 0;

    setInterval(() => {
        const plcToggle = document.getElementById("js-plc-toggle");
        if (plcToggle && plcToggle.checked) {
            intValue = Math.floor(Math.random() * 1024);
            if (fbdIn) fbdIn.textContent = intValue;

            for (let i = 0; i < 10; i++) {
                const line = document.getElementById(`js-fbd-l${i}`);
                const led = document.getElementById(`js-fbd-led${i}`);
                const text = document.getElementById(`js-fbd-t${i}`);
                const bitActive = (intValue & (1 << i)) ? 1 : 0;
                if (line && led && text) {
                    line.setAttribute("stroke", bitActive ? "var(--accent-red)" : "#334155");
                    led.setAttribute("fill", bitActive ? "var(--accent-red)" : "#223147");
                    text.textContent = `B${i}:${bitActive}`;
                    text.setAttribute("fill", bitActive ? "#ffffff" : "var(--text-muted)");
                    text.style.fontWeight = bitActive ? "bold" : "normal";
                }
            }
        }
    }, 1100);
});
</script>
</body>
</html>
